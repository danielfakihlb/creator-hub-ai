{% macro head(title) %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Creator Hub AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script>
    (function(){ try { var t = localStorage.getItem('chai-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){} })();
  </script>
</head>
{% endmacro %}
