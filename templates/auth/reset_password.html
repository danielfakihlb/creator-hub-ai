{% extends "base_auth.html" %}
{% block content %}
<h2 style="margin-bottom:6px;">Set a new password</h2>
<p class="text-secondary text-sm mb-4">Choose a new password for your account.</p>
<form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label>New password</label>
    <input type="password" name="password" required minlength="8" autofocus>
  </div>
  <div class="field">
    <label>Confirm new password</label>
    <input type="password" name="confirm_password" required minlength="8">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Reset password</button>
</form>
{% endblock %}
