{% extends "base_auth.html" %}
{% block content %}
<h2 style="margin-bottom:6px;">Forgot your password?</h2>
<p class="text-secondary text-sm mb-4">Enter the email on your account and we'll send you a link to reset it.</p>
<form method="post" action="{{ url_for('auth.forgot_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
</form>
<p class="text-sm text-secondary mt-4" style="text-align:center;"><a href="{{ url_for('auth.login') }}" style="color:var(--brand-400); font-weight:600;">Back to log in</a></p>
{% endblock %}
